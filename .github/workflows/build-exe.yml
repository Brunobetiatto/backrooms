# Compila o jogo em .exe (Windows) a cada push na main e publica numa Release.
# O launcher (launcher/Jogar.bat) baixa sempre a Release mais nova.
name: Build exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      # O Processing exige que a pasta tenha o mesmo nome do .pde principal
      - uses: actions/checkout@v4
        with:
          path: backrooms

      - name: Baixar Processing 4.3 e Minim
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest https://github.com/processing/processing4/releases/download/processing-1293-4.3/processing-4.3-windows-x64.zip -OutFile p.zip
          Expand-Archive p.zip -DestinationPath proc
          Invoke-WebRequest http://code.compartmental.net/minim/distro/minim_for_processing.zip -OutFile minim.zip
          Expand-Archive minim.zip -DestinationPath minim
          # jars na pasta code/ do sketch entram no classpath e no export
          New-Item -ItemType Directory -Force backrooms\code | Out-Null
          Copy-Item minim\minim\library\*.jar backrooms\code\

      - name: Exportar aplicativo
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force backrooms\.git, backrooms\.github -ErrorAction SilentlyContinue
          & proc\processing-4.3\processing-java.exe --sketch="$PWD\backrooms" --output="$PWD\out" --variant=windows-amd64 --export
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem out -Recurse -Filter backrooms.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "backrooms.exe nao foi gerado"; exit 1 }
          Compress-Archive -Path "$($exe.DirectoryName)\*" -DestinationPath backrooms-windows.zip

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: "Commit ${{ github.sha }}"
          files: backrooms-windows.zip
          make_latest: true
